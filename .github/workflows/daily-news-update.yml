name: Automated News Pipeline & Hostinger Deploy

on:
  schedule:
    # Runs twice every day: at 04:30 UTC (10:00 AM IST) and 12:30 UTC (6:00 PM IST)
    - cron: '30 4,12 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

# Prevent overlapping runs
concurrency:
  group: auto-news-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🔄 Scrape Latest News & Generate Dispatches
        run: |
          python scripts/auto_scrape_and_publish.py

      - name: 🏗️ Build Static Next.js Frontend & Sitemaps
        run: |
          cd frontend
          npm run build

      - name: 📋 Copy .htaccess to Output
        run: |
          cp frontend/public/.htaccess frontend/out/.htaccess || true

      - name: 💾 Commit & Push Updated Dispatches to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/seedArticles.ts frontend/public/
          if git diff --staged --quiet; then
            echo "No new dispatches to commit. Repository is up-to-date."
          else
            git commit -m "Auto-update latest news dispatches & sitemaps [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: 🔍 Test & Verify Hostinger FTPS Connection
        env:
          FTP_PWD: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          FTP_SRV: ${{ secrets.HOSTINGER_FTP_SERVER || secrets.FTP_SERVER || 'ftp.zestfeedx.com' }}
          FTP_USR: ${{ secrets.HOSTINGER_FTP_USERNAME || secrets.FTP_USERNAME || 'u340027669' }}
        run: |
          python - << 'EOF'
          import os, ftplib, ssl
          server = os.environ.get('FTP_SRV', 'ftp.zestfeedx.com')
          user = os.environ.get('FTP_USR', 'u340027669')
          pwd = os.environ.get('FTP_PWD', '')
          if not pwd:
              print("⚠️ Warning: No FTP password found in secrets.")
              exit(0)
          print(f"📡 Testing FTPS connection to {server} with user {user}...")
          try:
              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE
              ftp = ftplib.FTP_TLS(context=ctx, timeout=12)
              ftp.connect(server, 21)
              ftp.login(user, pwd)
              ftp.prot_p()
              print("✅ FTPS Authentication Successful!")
              dirs = ftp.nlst()
              print(f"📁 Root directory contents ({len(dirs)} items): {dirs[:10]}")
              ftp.quit()
          except Exception as e:
              print(f"❌ FTP Diagnostic Error: {e}")
          EOF

      - name: 🚀 Deploy to Hostinger via FTPS
        if: env.HOSTINGER_FTP_PASSWORD != '' || env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER || secrets.FTP_SERVER || 'ftp.zestfeedx.com' }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME || secrets.FTP_USERNAME || 'u340027669' }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          local-dir: ./frontend/out/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR || 'domains/zestfeedx.com/public_html/' }}
          security: loose
          dangerous-clean-slate: false

