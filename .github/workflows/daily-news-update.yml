name: Automated News Pipeline & Hostinger Deploy

on:
  schedule:
    # Runs twice every day: at 04:30 UTC (10:00 AM IST) and 12:30 UTC (6:00 PM IST)
    - cron: '30 4,12 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

# Prevent overlapping runs
concurrency:
  group: auto-news-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow googlenewsdecoder beautifulsoup4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🔄 Scrape Latest News & Generate Dispatches
        run: |
          python scripts/auto_scrape_and_publish.py

      - name: 🏗️ Build Static Next.js Frontend & Sitemaps
        run: |
          cd frontend
          npm run build

      - name: 📋 Copy .htaccess to Output
        run: |
          cp frontend/public/.htaccess frontend/out/.htaccess || true

      - name: 💾 Commit & Push Updated Dispatches to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/seedArticles.ts frontend/public/
          if git diff --staged --quiet; then
            echo "No new dispatches to commit. Repository is up-to-date."
          else
            git commit -m "Auto-update latest news dispatches & sitemaps [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: 🚀 Deploy to Hostinger via FTPS
        continue-on-error: true
        if: env.HOSTINGER_FTP_PASSWORD != '' || env.FTP_PASSWORD != ''
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER || secrets.FTP_SERVER || 'ftp.zestfeedx.com' }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME || secrets.FTP_USERNAME || 'u340027669' }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          HOSTINGER_FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR }}
        run: |
          python scripts/deploy_ftps.py

